name: Auto Build & Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml' # Workflow hanya jalan kalau ada perubahan versi di pubspec.yaml

jobs:
  build_and_release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dibutuhkan untuk membuat release dan commit file

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x' # Sesuaikan dengan versi yang dipakai lokal
          channel: 'stable'

      - name: Get pub dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test

      - name: Extract Version from pubspec.yaml
        id: extract_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION | cut -d '+' -f 1)
          VERSION_CODE=$(echo $VERSION | cut -d '+' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_TAG=v$VERSION_NAME" >> $GITHUB_ENV
          echo "Mendeteksi versi: v$VERSION_NAME (Build $VERSION_CODE)"

      - name: Validate Version Code Increase
        run: |
          PREV_CODE=$(git show HEAD~1:version.json 2>/dev/null | jq -r '.version_code // 0' 2>/dev/null || echo "0")
          if [ -z "$PREV_CODE" ] || [ "$PREV_CODE" = "null" ]; then
            PREV_CODE=0
          fi
          echo "Version code sebelumnya: $PREV_CODE, Version code baru: $VERSION_CODE"
          if [ "$VERSION_CODE" -le "$PREV_CODE" ]; then
            echo "::error::version_code ($VERSION_CODE) harus lebih besar dari rilis sebelumnya ($PREV_CODE)!"
            exit 1
          fi

      - name: Validate Keystore Secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.STORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "::error::Secrets keystore (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS) wajib diisi untuk menandatangani APK release!"
            exit 1
          fi

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK (Retry up to 3x)
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "=== Memulai build APK (Percobaan $RETRY_COUNT/$MAX_RETRIES) ==="
            if flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} -v > build_log.txt 2>&1; then
              echo "Build APK berhasil pada percobaan ke-$RETRY_COUNT!"
              SUCCESS=1
              break
            else
              echo "Build APK gagal pada percobaan ke-$RETRY_COUNT."
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Menunggu 60 detik sebelum mencoba lagi..."
                sleep 60
              fi
            fi
          done
          if [ $SUCCESS -ne 1 ]; then
            echo "::error::Build APK gagal setelah $MAX_RETRIES percobaan!"
            exit 1
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build_log.txt

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk CetakNotaBT.apk

      - name: Update version.json
        run: |
          APK_SIZE=$(wc -c < CetakNotaBT.apk | tr -d ' ')
          APK_CHECKSUM=$(sha256sum CetakNotaBT.apk | awk '{print $1}')
          EXISTING_CHANGELOG=$(jq -r '.changelog // "Pembaruan fitur & perbaikan bug."' version.json 2>/dev/null || echo "Pembaruan fitur & perbaikan bug.")
          EXISTING_FORCE_UPDATE=$(jq -r '.force_update // false' version.json 2>/dev/null || echo "false")

          echo "Menyusun version.json dengan ukuran $APK_SIZE bytes dan SHA-256 $APK_CHECKSUM..."
          jq -n \
            --arg vc "$VERSION_CODE" \
            --arg vn "$VERSION_NAME" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION_TAG }}/CetakNotaBT.apk" \
            --arg cl "$EXISTING_CHANGELOG" \
            --argjson fu "$EXISTING_FORCE_UPDATE" \
            --arg cs "$APK_CHECKSUM" \
            --argjson size "$APK_SIZE" \
            '{
              version_code: ($vc | tonumber),
              version_name: $vn,
              download_url: $url,
              changelog: $cl,
              force_update: $fu,
              apk_checksum: $cs,
              apk_size_bytes: $size
            }' > version.json
          cat version.json

      - name: Commit version.json back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: auto-update version.json to ${{ env.VERSION_TAG }} [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "CetakNota ${{ env.VERSION_TAG }}"
          body: "Pembaruan otomatis CetakNota ke versi ${{ env.VERSION_TAG }} (Build ${{ env.VERSION_CODE }})"
          files: CetakNotaBT.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
